app-id: org.luanti.luanti
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: luanti
rename-icon: luanti
copy-icon: true
finish-args:
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=ipc
  - --share=network
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/aclocal
  - /share/gtk-doc
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - libzip.yaml
  - shared-modules/luajit/luajit.json

  - name: luanti
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_CURSES=0
      - -DENABLE_GETTEXT=1
    cleanup:
      - /share/minetest/games/devtest
    post-install:
      - mv $FLATPAK_DEST/bin/luanti $FLATPAK_DEST/bin/luanti.bin
      - install -Dm755 luanti.sh $FLATPAK_DEST/bin/luanti
    sources:
      - type: git
        url: https://codeberg.org/halon/Minetest.git
        commit: a0ed3895e8136a1934f9286fd5b995b71693214e
      - type: patch
        path: patches/enable_csm.patch
      - type: script
        dest-filename: luanti.sh
        commands:
          - MINETEST_USER_PATH=$HOME/.var/app/org.luanti.luanti/.minetest exec luanti.bin
            "$@"
